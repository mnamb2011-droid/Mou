name: Build Android APK (Flat Repo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android project structure from flat files
        shell: bash
        run: |
          set -e

          # Locate flat HTML file (index.html or wifi_mouse_android.html)
          if [ -f "index.html" ]; then
            HTML_SRC="index.html"
          elif [ -f "wifi_mouse_android.html" ]; then
            HTML_SRC="wifi_mouse_android.html"
          else
            echo "ERROR: index.html or wifi_mouse_android.html not found in repo root!"
            exit 1
          fi

          # Locate any flat icon file
          ICON_SRC=""
          for f in icon.png icon_1024.png icon_4k.png wifi_mouse_icon_4k.png icon.jpg icon.webp; do
            if [ -f "$f" ]; then
              ICON_SRC="$f"
              break
            fi
          done

          rm -rf app
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/wifimouse/pc
          mkdir -p app/src/main/res/values
          cp "$HTML_SRC" app/src/main/assets/index.html

          # Generate all Android mipmap icons (with safe fallback if uploaded image is corrupted)
          python3 -m pip install -q pillow
          python3 - "$ICON_SRC" <<'PYEOF'
          import os, sys
          from PIL import Image, ImageDraw

          icon_path = sys.argv[1] if len(sys.argv) > 1 else ""
          im = None
          if icon_path and os.path.isfile(icon_path):
              try:
                  im = Image.open(icon_path).convert("RGBA")
                  print(f"Loaded icon: {icon_path} ({im.size})")
              except Exception as e:
                  print(f"WARN: Could not read '{icon_path}' ({e}); generating clean fallback icon.")

          if im is None:
              # Clean built-in fallback Wi-Fi Mouse icon (512x512)
              im = Image.new("RGBA", (512, 512), (8, 13, 26, 255))
              d = ImageDraw.Draw(im)
              d.rounded_rectangle([16, 16, 496, 496], radius=110, fill=(17, 27, 54, 255), outline=(56, 189, 248, 255), width=8)
              # Wi-Fi arcs
              for rad, w in [(115, 16), (78, 16), (42, 16)]:
                  d.arc([256 - rad, 165 - rad, 256 + rad, 165 + rad], start=215, end=325, fill=(56, 189, 248, 255), width=w)
              # Mouse body
              d.rounded_rectangle([176, 215, 336, 435], radius=80, fill=(30, 58, 138, 255), outline=(125, 211, 252, 255), width=8)
              d.line([256, 215, 256, 305], fill=(125, 211, 252, 255), width=6)
              d.rounded_rectangle([244, 245, 268, 292], radius=12, fill=(56, 189, 248, 255))

          def make_icon(size, circle=False):
              r = im.resize((size, size), Image.Resampling.LANCZOS)
              if not circle:
                  return r
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, size - 1, size - 1], fill=255)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(r, (0, 0), mask)
              return out

          for folder, sz in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]:
              d = os.path.join("app/src/main/res", folder)
              os.makedirs(d, exist_ok=True)
              make_icon(sz, False).save(os.path.join(d, "ic_launcher.png"), "PNG")
              make_icon(sz, True).save(os.path.join(d, "ic_launcher_round.png"), "PNG")
          PYEOF

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WiFiMousePC"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wifimouse.pc'
              compileSdk 34

              defaultConfig {
                  applicationId "com.wifimouse.pc"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">#080D1A</item>
                  <item name="android:statusBarColor">#080D1A</item>
                  <item name="android:navigationBarColor">#080D1A</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="ماوس PC"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name="com.wifimouse.pc.MainActivity"
                      android:label="ماوس PC"
                      android:enabled="true"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.action.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/wifimouse/pc/MainActivity.java <<'EOF'
          package com.wifimouse.pc;

          import android.annotation.SuppressLint;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private WebView webView;
              private long lastBackPress = 0;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF080D1A);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBackPress = now;
                      Toast.makeText(this, "اضغط مرة أخرى للخروج", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Verify APK Launchable Activity & Icon
        shell: bash
        run: |
          AAPT2=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -name aapt2 | sort -V | tail -n 1)
          echo "Checking APK with: $AAPT2"
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "package:|application-label:|launchable-activity:|application-icon"
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "launchable-activity:"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiMouse-DESKTOP-DDNCUOL-APK
          path: app/build/outputs/apk/debug/app-debug.apk

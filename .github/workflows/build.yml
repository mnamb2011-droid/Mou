name: Build Android APK (Flat Repo)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Android project structure from flat files
        shell: bash
        run: |
          set -e

          # Locate flat HTML file (index.html or wifi_mouse_android.html)
          if [ -f "index.html" ]; then
            HTML_SRC="index.html"
          elif [ -f "wifi_mouse_android.html" ]; then
            HTML_SRC="wifi_mouse_android.html"
          else
            echo "ERROR: index.html or wifi_mouse_android.html not found in repo root!"
            exit 1
          fi

          # Locate flat 4K icon (icon_4k.png or wifi_mouse_icon_4k.png)
          if [ -f "icon_4k.png" ]; then
            ICON_SRC="icon_4k.png"
          elif [ -f "wifi_mouse_icon_4k.png" ]; then
            ICON_SRC="wifi_mouse_icon_4k.png"
          else
            ICON_SRC=""
          fi

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/wifimouse/pc
          mkdir -p app/src/main/res/values
          cp "$HTML_SRC" app/src/main/assets/index.html

          # Generate all Android mipmap icons from the flat 4K PNG
          if [ -n "$ICON_SRC" ]; then
            python3 -m pip install -q pillow
            python3 - "$ICON_SRC" <<'PYEOF'
          import os, sys
          from PIL import Image, ImageDraw

          im = Image.open(sys.argv[1]).convert("RGBA")

          def make_icon(size, circle=False):
              r = im.resize((size, size), Image.Resampling.LANCZOS)
              if not circle:
                  return r
              mask = Image.new("L", (size, size), 0)
              ImageDraw.Draw(mask).ellipse([0, 0, size - 1, size - 1], fill=255)
              out = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              out.paste(r, (0, 0), mask)
              return out

          for folder, sz in [
              ("mipmap-mdpi", 48),
              ("mipmap-hdpi", 72),
              ("mipmap-xhdpi", 96),
              ("mipmap-xxhdpi", 144),
              ("mipmap-xxxhdpi", 192),
          ]:
              d = os.path.join("app/src/main/res", folder)
              os.makedirs(d, exist_ok=True)
              make_icon(sz, False).save(os.path.join(d, "ic_launcher.png"), "PNG")
              make_icon(sz, True).save(os.path.join(d, "ic_launcher_round.png"), "PNG")
          PYEOF
          fi

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WiFiMousePC"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.wifimouse.pc'
              compileSdk 34

              defaultConfig {
                  applicationId "com.wifimouse.pc.ddncuol"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:windowBackground">#080D1A</item>
                  <item name="android:statusBarColor">#080D1A</item>
                  <item name="android:navigationBarColor">#080D1A</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="ماوس PC"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/wifimouse/pc/MainActivity.java <<'EOF'
          package com.wifimouse.pc;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;
              private long lastBackPress = 0;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.setBackgroundColor(0xFF080D1A);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowFileAccessFromFileURLs(true);
                  s.setAllowUniversalAccessFromFileURLs(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setCacheMode(WebSettings.LOAD_NO_CACHE);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  long now = System.currentTimeMillis();
                  if (now - lastBackPress < 2000) {
                      super.onBackPressed();
                  } else {
                      lastBackPress = now;
                      Toast.makeText(this, "اضغط مرة أخرى للخروج", Toast.LENGTH_SHORT).show();
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiMouse-DESKTOP-DDNCUOL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
